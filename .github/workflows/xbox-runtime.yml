name: Xbox runtime loader

on:
  push:
    branches: [xbox/bootstrap]
    paths: [runtime/xbox/**, .github/workflows/xbox-runtime.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loader:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run synthetic loader tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 runtime/xbox/tests/test_loader.py -v 2>&1 | tee artifacts/loader-tests.log
      - uses: actions/checkout@v4
        with:
          repository: XboxDev/nxdk
          ref: 14d5ee97e73347c973f1f57b68b79ec08c9e77f2
          path: sdk/nxdk
          submodules: recursive
          persist-credentials: false
      - name: Install host build tools
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - name: Build loader diagnostic (not a game boot)
        shell: bash
        run: |
          set -euo pipefail
          export NXDK_DIR="$PWD/sdk/nxdk"
          export PATH="$NXDK_DIR/bin:$PATH"
          make -C runtime/xbox/loader-probe -j2 2>&1 | tee artifacts/loader-xbe-build.log
          cp runtime/xbox/loader-probe/bin/default.xbe artifacts/ModernGekkoX-loader-probe.xbe
          llvm-readobj --file-headers runtime/xbox/loader-probe/main.exe > artifacts/loader-pe-headers.txt
          grep -q IMAGE_FILE_MACHINE_I386 artifacts/loader-pe-headers.txt
          python3 -c "from pathlib import Path; assert Path('artifacts/ModernGekkoX-loader-probe.xbe').read_bytes()[:4] == b'XBEH'"
      - name: Export tracked source and revisions (no game data)
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > artifacts/REVISION.txt
          git -C sdk/nxdk rev-parse HEAD > artifacts/NXDK-REVISION.txt
          git -C sdk/nxdk submodule status --recursive > artifacts/NXDK-SUBMODULES.txt
          git archive --format=tar HEAD | gzip > artifacts/ModernGekkoX-B002-source.tar.gz
          sha256sum artifacts/ModernGekkoX-loader-probe.xbe artifacts/ModernGekkoX-B002-source.tar.gz > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ModernGekkoX-B002-loader
          path: artifacts/
          retention-days: 14
