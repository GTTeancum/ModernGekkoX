name: Xbox runtime validation

on:
  push:
    branches: [xbox/bootstrap]
    paths: [runtime/xbox/**, .github/workflows/xbox-runtime.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install host build and diagnostic tools
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm qemu-user
      - name: Validate loader and math (synthetic data only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 runtime/xbox/tests/test_loader.py -v 2>&1 | tee artifacts/loader-tests.log
          python3 runtime/xbox/tests/test_math.py --vectors artifacts/fma-vectors.bin --output artifacts/math-validation.json 2>&1 | tee artifacts/math-tests.log
          python3 runtime/xbox/tests/run_math_i386.py --vectors artifacts/fma-vectors.bin --output artifacts/i386 --qemu 2>&1 | tee artifacts/math-i386.log
      - uses: actions/checkout@v4
        with:
          repository: GTTeancum/DolRecompX
          ref: 713dc980c27120f2b420f9994f8519a51b0743c0
          path: compiler
          persist-credentials: false
      - name: Validate fail-closed execution, timebase and opt-in device profiles (synthetic only)
        shell: bash
        run: |
          set -euo pipefail
          python3 runtime/xbox/tests/run_exec_tests.py --compiler-source compiler --sanitize --output artifacts/exec-tests.json 2>&1 | tee artifacts/exec-tests.log
          python3 runtime/xbox/tests/test_trace_bridge.py -v 2>&1 | tee artifacts/trace-bridge-tests.log
          python3 runtime/xbox/tests/test_nxdk_memory.py -v 2>&1 | tee artifacts/nxdk-memory-tests.log
          python3 runtime/xbox/tests/test_host_builder.py -v 2>&1 | tee artifacts/host-builder-tests.log
          python3 runtime/xbox/tests/test_memory_audit.py -v 2>&1 | tee artifacts/memory-audit-tests.log
          python3 runtime/xbox/tests/test_probe_cli.py --compiler-source compiler -v 2>&1 | tee artifacts/probe-cli-tests.log
      - uses: actions/checkout@v4
        with:
          repository: XboxDev/nxdk
          ref: 14d5ee97e73347c973f1f57b68b79ec08c9e77f2
          path: sdk/nxdk
          submodules: recursive
          persist-credentials: false
      - name: Build Xbox diagnostics and compile execution bridge (not game boots)
        shell: bash
        run: |
          set -euo pipefail
          export NXDK_DIR="$PWD/sdk/nxdk"
          export PATH="$NXDK_DIR/bin:$PATH"
          make -C runtime/xbox/loader-probe -j2 2>&1 | tee artifacts/loader-xbe-build.log
          make -C runtime/xbox/math-probe -j2 2>&1 | tee artifacts/math-xbe-build.log
          nxdk-cc -std=gnu11 -O1 -fno-fast-math -ffp-contract=off -frounding-math -Icompiler/src -Iruntime/xbox/include -c runtime/xbox/src/mgx_exec.c -o artifacts/mgx_exec-xbox.obj
          nxdk-cc -std=gnu11 -O1 -fno-fast-math -ffp-contract=off -frounding-math -Icompiler/src -Iruntime/xbox/include -include runtime/xbox/include/mgx_math_redirect.h -c compiler/src/cpu/cpu.c -o artifacts/cpu-xbox.obj
          llvm-readobj --file-headers artifacts/mgx_exec-xbox.obj artifacts/cpu-xbox.obj > artifacts/exec-coff-headers.txt
          grep -q IMAGE_FILE_MACHINE_I386 artifacts/exec-coff-headers.txt
          python3 runtime/xbox/tests/test_xbox_builder.py --sdk sdk/nxdk --compiler-source compiler -v 2>&1 | tee artifacts/nxdk-builder-tests.log
          python3 runtime/xbox/tests/test_memory_abi.py --sdk sdk/nxdk --compiler-source compiler --output artifacts/memory-abi --qemu 2>&1 | tee artifacts/memory-abi.log
          cp runtime/xbox/loader-probe/bin/default.xbe artifacts/ModernGekkoX-loader-probe.xbe
          cp runtime/xbox/math-probe/bin/default.xbe artifacts/ModernGekkoX-math-probe.xbe
          llvm-readobj --file-headers runtime/xbox/math-probe/main.exe > artifacts/math-pe-headers.txt
          llvm-objdump -d runtime/xbox/src/mgx_math.obj > artifacts/math-xbox-disassembly.txt
          grep -q IMAGE_FILE_MACHINE_I386 artifacts/math-pe-headers.txt
      - name: Export source and SDK link support (no game data, no fonts)
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > artifacts/REVISION.txt
          git -C compiler rev-parse HEAD > artifacts/COMPILER-REVISION.txt
          git -C sdk/nxdk rev-parse HEAD > artifacts/NXDK-REVISION.txt
          git archive --format=tar HEAD | gzip > artifacts/ModernGekkoX-B007-source.tar.gz
          find sdk/nxdk/lib -name '*.lib' -type f > artifacts/sdk-link-files.txt
          printf '%s\n' sdk/nxdk/tools/cxbe/cxbe >> artifacts/sdk-link-files.txt
          tar -czf artifacts/nxdk-B007-link-support.tar.gz -T artifacts/sdk-link-files.txt
          sha256sum artifacts/*.xbe artifacts/*.tar.gz > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ModernGekkoX-B007-validation
          path: artifacts/
          retention-days: 14
